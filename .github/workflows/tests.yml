name: Lua tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: lua5.1 tests/test-auras.lua .
      - run: |
          luac5.1 -p Auras.lua
          luac5.1 -p Locales.lua
          luac5.1 -p Options.lua
